<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meydan — Pickup Football MVP</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #1d3326 0%, #0a1814 70%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  #root { height: 100%; }

  .stage {
    height: 100vh; width: 100vw;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    padding: 28px;
    box-sizing: border-box;
    overflow: hidden;
  }

  /* Side label */
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 6px 12px; border-radius: 99;
    color: rgba(255,255,255,0.85);
    font-size: 12.5px; font-weight: 600;
    letter-spacing: 0.2px;
    backdrop-filter: blur(8px);
  }
  .badge .dot {
    width: 7px; height: 7px; border-radius: 99; background: #c6f24e;
    box-shadow: 0 0 8px rgba(198,242,78,0.6);
  }

  .device-wrap {
    transform-origin: center;
  }

  .hint {
    font-size: 12px; color: rgba(255,255,255,0.5);
    display: flex; align-items: center; gap: 10px;
  }
  .hint a { color: rgba(255,255,255,0.85); text-decoration: none; border-bottom: 1px dotted rgba(255,255,255,0.4); }
  .hint a:hover { color: #c6f24e; border-color: #c6f24e; }
  kbd {
    background: rgba(255,255,255,0.1);
    padding: 1px 6px; border-radius: 4px;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    border: 1px solid rgba(255,255,255,0.15);
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="router.jsx"></script>
<script type="text/babel" src="screens/onboarding.jsx"></script>
<script type="text/babel" src="screens/home.jsx"></script>
<script type="text/babel" src="screens/detail.jsx"></script>
<script type="text/babel" src="screens/payment.jsx"></script>
<script type="text/babel" src="screens/profile.jsx"></script>

<script type="text/babel" data-presets="env,react">

// Registry of all screens (router resolves by name).
window.SCREENS = {
  home: HomeScreen,
  detail: DetailScreen,
  payment: PaymentScreen,
  profile: ProfileScreen,
};

const PHONE_W = 390;
const PHONE_H = 844;

function Stage() {
  // Auto-scale the phone to fit the available vertical space, with margin
  // for the labels/hint.
  const [scale, setScale] = React.useState(1);

  React.useEffect(() => {
    const fit = () => {
      const margin = 180;
      const s = Math.min(
        (window.innerHeight - margin) / PHONE_H,
        (window.innerWidth - 80) / PHONE_W,
        1.05,
      );
      setScale(Math.max(0.4, s));
    };
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);

  return (
    <div className="stage">
      <div className="badge">
        <span className="dot" />
        Meydan · MVP prototype · Baku
      </div>

      <div className="device-wrap" style={{
        transform: `scale(${scale})`,
        width: PHONE_W, height: PHONE_H,
      }}>
        <AppProvider>
          <IOSDevice width={PHONE_W} height={PHONE_H}>
            <div style={{ position: 'absolute', inset: 0 }}>
              <Router />
            </div>
          </IOSDevice>
        </AppProvider>
      </div>

      <div className="hint">
        Interactive prototype — tap through onboarding, browse games, join one to test the payment flow.
        <span style={{ opacity: 0.5 }}>·</span>
        <a href="Home variations.html">Compare home layouts</a>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Stage />);
</script>
</body>
</html>
