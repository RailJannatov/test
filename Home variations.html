<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pickup Football — Home Screen Explorations</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif; }
  #root { height: 100%; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="screen-list.jsx"></script>
<script type="text/babel" src="screen-map.jsx"></script>
<script type="text/babel" src="screen-hero.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel" data-presets="env,react">
const PHONE_W = 390;
const PHONE_H = 844;

// Wrap a Screen component in an iOS device frame for the canvas.
function Frame({ Screen }) {
  return (
    <IOSDevice width={PHONE_W} height={PHONE_H}>
      <Screen />
    </IOSDevice>
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="home"
        title="Home screen — Pickup Football"
        subtitle="CeleBreak-style discovery for casual football in Barcelona · three layout directions">

        <DCArtboard id="list" label="A · Classic list"
          width={PHONE_W + 24} height={PHONE_H + 24}>
          <div style={{ padding: 12 }}>
            <Frame Screen={ScreenList} />
          </div>
        </DCArtboard>

        <DCArtboard id="map" label="B · Map-first"
          width={PHONE_W + 24} height={PHONE_H + 24}>
          <div style={{ padding: 12 }}>
            <Frame Screen={ScreenMap} />
          </div>
        </DCArtboard>

        <DCArtboard id="hero" label="C · Hero + grid"
          width={PHONE_W + 24} height={PHONE_H + 24}>
          <div style={{ padding: 12 }}>
            <Frame Screen={ScreenHero} />
          </div>
        </DCArtboard>

      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
